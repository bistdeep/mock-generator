<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GATE Mock Generator</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loader"></div>
    <p>Generating mock from CSV...</p>
  </div>
  
  <body>
    <div class="container">
      <h1>🎓 GATE Mock Test Generator</h1>

      <div class="section">
        <div class="section-title">Mock Title</div>
        <div class="control-group">
          <input
            type="text"
            id="mockTitle"
            placeholder="Enter Mock Test Title"
          />
        </div>
      </div>

      <div class="section">
        <div class="section-title">Select Subject</div>
        <div class="control-group">
          <select id="subject">
            <option value="" disabled selected>Select a subject</option>
          </select>
          <button onclick="loadQuestions()">Load Questions</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Choose Question</div>
        <div class="control-group">
          <select id="questions">
            <option value="" disabled selected>Select a question</option>
          </select>
          <button onclick="addQuestion()">Add to Mock</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-title">Upload CSV (Auto Generate)</div>
        <div class="control-group">
          <div class="file-upload-wrapper">
            <input
              type="file"
              id="csvFile"
              accept=".csv"
              onchange="updateFileName(this)"
            />
            <label for="csvFile" class="file-upload-label">
              <span class="file-name">Choose a CSV file...</span>
              <span class="upload-icon">⬆️</span>
            </label>
          </div>
          <button onclick="uploadCSV()">Generate from CSV</button>
        </div>
      </div>

      <div class="section preview-section">
        <div class="section-title">Preview</div>
        <textarea
          id="preview"
          placeholder="Your mock test will appear here..."
        ></textarea>
      </div>

      <div class="export-section">
        <button onclick="exportPDF()">📄 Export as PDF</button>
        <button onclick="downloadMarkdown()">⬇️ Download Markdown</button>
      </div>
    </div>

    <script src="/static/scripts.js"></script>
  </body>
</html>
