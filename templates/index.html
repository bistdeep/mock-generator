<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GATE Mock Generator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: #e0e0e0;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: rgba(30, 30, 46, 0.9);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
      }

      h1 {
        text-align: center;
        color: #00d4ff;
        font-size: 2.5em;
        margin-bottom: 40px;
        text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        font-weight: 600;
      }

      .section {
        margin-bottom: 30px;
        padding: 25px;
        background: rgba(40, 40, 60, 0.6);
        border-radius: 15px;
        border: 1px solid rgba(0, 212, 255, 0.1);
        transition: all 0.3s ease;
      }

      .section:hover {
        border-color: rgba(0, 212, 255, 0.3);
        box-shadow: 0 5px 20px rgba(0, 212, 255, 0.1);
      }

      .section-title {
        color: #00d4ff;
        font-size: 1.2em;
        margin-bottom: 15px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .section-title::before {
        content: "";
        width: 4px;
        height: 20px;
        background: #00d4ff;
        border-radius: 2px;
      }

      .control-group {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        align-items: center;
      }

      select {
        flex: 1;
        min-width: 200px;
        padding: 12px 16px;
        background: rgba(20, 20, 35, 0.8);
        border: 2px solid rgba(0, 212, 255, 0.2);
        border-radius: 10px;
        color: #e0e0e0;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      select:hover {
        border-color: rgba(0, 212, 255, 0.5);
      }

      select:focus {
        border-color: #00d4ff;
        box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      }

      button {
        padding: 12px 30px;
        background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        background: linear-gradient(135deg, #00e5ff 0%, #00b8e6 100%);
      }

      button:active {
        transform: translateY(0);
      }

      .preview-section {
        margin-top: 30px;
      }

      textarea {
        width: 100%;
        min-height: 400px;
        padding: 20px;
        background: rgba(20, 20, 35, 0.9);
        border: 2px solid rgba(0, 212, 255, 0.2);
        border-radius: 15px;
        color: #e0e0e0;
        font-family: "Consolas", "Monaco", "Courier New", monospace;
        font-size: 14px;
        line-height: 1.6;
        resize: vertical;
        transition: all 0.3s ease;
        outline: none;
      }

      textarea:focus {
        border-color: #00d4ff;
        box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      }

      .export-section {
        margin-top: 30px;
        text-align: center;
      }

      .export-section button {
        padding: 15px 50px;
        font-size: 16px;
        background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
        box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
      }

      .export-section button:hover {
        background: linear-gradient(135deg, #00ff99 0%, #00dd7a 100%);
        box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
      }

      .divider {
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(0, 212, 255, 0.3) 50%,
          transparent 100%
        );
        margin: 30px 0;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(20, 20, 35, 0.5);
        border-radius: 5px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(0, 212, 255, 0.4);
        border-radius: 5px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 212, 255, 0.6);
      }

      /* Responsive design */
      @media (max-width: 768px) {
        .container {
          padding: 20px;
        }

        h1 {
          font-size: 2em;
        }

        .control-group {
          flex-direction: column;
        }

        select {
          width: 100%;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎓 GATE Mock Test Generator</h1>

      <div class="section">
        <div class="section-title">Select Subject</div>
        <div class="control-group">
          <select id="subject">
            <option value="" disabled selected>Select a subject</option>
          </select>
          <button onclick="loadQuestions()">Load Questions</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Choose Question</div>
        <div class="control-group">
          <select id="questions">
            <option value="" disabled selected>Select a question</option>
          </select>
          <button onclick="addQuestion()">Add to Mock</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section preview-section">
        <div class="section-title">Preview</div>
        <textarea
          id="preview"
          placeholder="Your mock test will appear here..."
        ></textarea>
      </div>

      <div class="export-section">
        <button onclick="exportPDF()">📄 Export as PDF</button>
      </div>
    </div>

    <script src="/static/scripts.js"></script>
  </body>
</html>
